services:

  # ============================================================
  # HEALTHCARE SOURCE DATABASE
  # ============================================================
  postgres:
    image: postgres:16
    container_name: healthcare_postgres

    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare_user
      POSTGRES_PASSWORD: healthcare_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql


  # ============================================================
  # AIRFLOW METADATA DATABASE
  # ============================================================
  airflow-db:
    image: postgres:16
    container_name: healthcare_airflow_db

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_db_data:/var/lib/postgresql/data


  # ============================================================
  # AIRFLOW INITIALIZATION
  # ============================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: healthcare_airflow_init

    depends_on:
      - airflow-db
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__WEBSERVER__SECRET_KEY: "healthcare_airflow_shared_secret_key_2026"

      HEALTHCARE_DATABASE_URL: postgresql+psycopg2://healthcare_user:healthcare_password@postgres:5432/healthcare
      DATA_PATH: /opt/airflow/data

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Healthcare
      --lastname Admin
      --role Admin
      --email admin@example.com || true
      "


  # ============================================================
  # AIRFLOW WEBSERVER
  # UI: http://localhost:8081
  # ============================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: healthcare_airflow_webserver

    depends_on:
      - airflow-db
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__WEBSERVER__SECRET_KEY: "healthcare_airflow_shared_secret_key_2026"

      HEALTHCARE_DATABASE_URL: postgresql+psycopg2://healthcare_user:healthcare_password@postgres:5432/healthcare
      DATA_PATH: /opt/airflow/data

    ports:
      - "8081:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data

    command: webserver


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: healthcare_airflow_scheduler

    depends_on:
      - airflow-db
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__WEBSERVER__SECRET_KEY: "healthcare_airflow_shared_secret_key_2026"

      HEALTHCARE_DATABASE_URL: postgresql+psycopg2://healthcare_user:healthcare_password@postgres:5432/healthcare
      DATA_PATH: /opt/airflow/data

    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data

    command: scheduler


# ==============================================================
# PERSISTENT STORAGE
# ==============================================================
volumes:
  postgres_data:
  airflow_db_data: