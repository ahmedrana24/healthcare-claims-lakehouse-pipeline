name: Healthcare Claims Pipeline CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  validate-pipeline:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            pyarrow \
            pyspark \
            sqlalchemy \
            psycopg2-binary



      - name: Validate DAG syntax
        run: |

          python - <<EOF

          import ast

          with open(
              "dags/healthcare_claims_pipeline.py"
          ) as f:

              ast.parse(
                  f.read()
              )

          print(
              "DAG syntax validation successful"
          )

          EOF



      - name: Validate Python scripts
        run: |

          python -m compileall scripts/

          echo "Python validation successful"